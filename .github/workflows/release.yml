name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v; must have CHANGELOG.md notes
        required: true
      prerelease:
        description: Publish as a prerelease
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: atlas-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and release notes
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          python3 scripts/linux_release.py metadata --version "$version"
          prerelease=false
          if [[ "$version" == *-* || "$INPUT_PRERELEASE" == true ]]; then prerelease=true; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  windows:
    needs: metadata
    uses: ./.github/workflows/windows-packages.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
      edition: free
      source-url: https://github.com/${{ github.repository }}/releases/download/v${{ needs.metadata.outputs.version }}/atlas-${{ needs.metadata.outputs.version }}-source.zip

  linux:
    needs: metadata
    uses: ./.github/workflows/linux-packages.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
      edition: free
      source-url: https://github.com/${{ github.repository }}/releases/download/v${{ needs.metadata.outputs.version }}/atlas-${{ needs.metadata.outputs.version }}-source.zip

  publish:
    name: Publish verified GitHub release
    runs-on: ubuntu-24.04
    needs: [metadata, windows, linux]
    env:
      ATLAS_VERSION: ${{ needs.metadata.outputs.version }}
      ATLAS_TAG: ${{ needs.metadata.outputs.tag }}
      ATLAS_PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      # The Store MSIX is submitted by hand; the direct-download installer ships with the release.
      - uses: actions/download-artifact@v4
        with:
          pattern: atlas-linux-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: atlas-source
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: atlas-windows-installer-x86_64
          path: windows-installer
      - name: Add the Windows installer to the release files
        run: cp windows-installer/AtlasSetup-*.exe dist/
      - name: Final checksums and release notes
        run: |
          python3 scripts/linux_release.py metadata --version "$ATLAS_VERSION"
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from linux_release import write_checksums
          write_checksums(Path('dist'))
          PY
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Render winget, AUR and Flatpak manifests from the published files
        run: python3 scripts/render_package_manifests.py --version "$ATLAS_VERSION" --dist dist --output target/package-manifests
      - uses: actions/upload-artifact@v4
        with:
          name: package-manifests
          path: target/package-manifests
      - name: Create and publish a draft after all Linux checks pass
        run: |
          flags=()
          if [ "$ATLAS_PRERELEASE" = true ]; then flags+=(--prerelease --latest=false); fi
          if gh release view "$ATLAS_TAG" --json isDraft > /tmp/atlas-existing-release.json 2>/dev/null; then
            python3 - <<'PY'
          import json
          if not json.load(open('/tmp/atlas-existing-release.json'))['isDraft']:
              raise SystemExit('A published release must not be overwritten; use a new version')
          PY
          else
            gh release create "$ATLAS_TAG" --draft --target "$GITHUB_SHA" \
              --title "Atlas $ATLAS_VERSION" --notes-file target/linux-release/release-notes.md "${flags[@]}"
          fi
          gh release upload "$ATLAS_TAG" dist/* --clobber
          gh release edit "$ATLAS_TAG" --draft=false --notes-file target/linux-release/release-notes.md "${flags[@]}"
      - name: Publish to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          ATLAS_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "No AUR_SSH_PRIVATE_KEY secret configured; skipping AUR publish."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519,rsa aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/atlas-filemanager-bin.git /tmp/aur-repo
          cp target/package-manifests/linux/aur/PKGBUILD target/package-manifests/linux/aur/.SRCINFO /tmp/aur-repo/
          cd /tmp/aur-repo
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR is already up to date."
            exit 0
          fi
          git -c user.name="${{ github.repository_owner }}" -c user.email="${{ github.repository_owner }}@users.noreply.github.com" \
            commit -m "Update to $ATLAS_VERSION"
          git push origin HEAD:master

  repositories:
    needs: [metadata, publish]
    if: ${{ vars.ATLAS_LINUX_REPOSITORIES_ENABLED == 'true' }}
    uses: ./.github/workflows/linux-repositories.yml
    with:
      tag: ${{ needs.metadata.outputs.tag }}
    secrets: inherit
